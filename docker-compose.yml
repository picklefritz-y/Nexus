version: "3.8"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nexus_default_pw}
      POSTGRES_DB: nexus
    volumes:
      - nexus_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://nexus:${DB_PASSWORD:-nexus_default_pw}@db:5432/nexus
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY:-}
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
      NODE_ENV: production
    volumes:
      - nexus_uploads:/app/uploads

volumes:
  nexus_data:
  nexus_uploads:
